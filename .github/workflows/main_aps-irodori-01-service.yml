name: Build and deploy Node.js app to Azure Web App - aps-IRODORI-01-service

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: npm install and build
        run: |
          npm ci
          npm run build --if-present

      - name: Copy artifact for deployment job
        run: |
          mkdir deploy
          # standaloneビルドの内容をコピー
          cp -r ./.next/standalone/. ./deploy/
          # staticファイルをコピー
          mkdir -p ./deploy/.next/static
          cp -r ./.next/static/. ./deploy/.next/static/ || echo "No static directory found"
          # publicフォルダがある場合はコピー
          cp -r ./public ./deploy/public || echo "No public directory found"
          # 不要なファイルを除外
          find ./deploy -name "*.map" -delete || true
          find ./deploy -name ".git*" -delete || true
          find ./deploy -name "node_modules/.cache" -type d -exec rm -rf {} + || true
          # ファイル数を確認
          echo "Total files in deploy: $(find ./deploy -type f | wc -l)"

      - name: Zip artifact for deployment
        run: |
          cd deploy
          zip -r ../release.zip . -x "*.map" "node_modules/.cache/*"

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: release.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: 'Production'
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v2
        with:
          app-name: 'aps-IRODORI-01-service'
          slot-name: 'Production'
          package: release.zip
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_F0E9C33F765B4B56A224959CC04D6A5F }}
          startup-file: 'server.js'
