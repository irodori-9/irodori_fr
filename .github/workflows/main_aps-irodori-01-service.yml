name: Build and deploy Node.js app to Azure Web App - aps-IRODORI-01-service

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build
        env:
          NODE_ENV: production
          NEXT_PUBLIC_API_BASE_URL: ${{ secrets.NEXT_PUBLIC_API_BASE_URL }}

      - name: Install production dependencies only
        run: |
          rm -rf node_modules
          npm ci --only=production

      - name: Create deployment package
        run: |
          mkdir deploy-package

          # --- Standalone出力の場合 ---
          if [ -d ".next/standalone" ]; then
            echo "Standalone mode detected"
            cp -r .next/standalone/* deploy-package/

            if [ -d ".next/static" ]; then
              mkdir -p deploy-package/.next/static
              cp -r .next/static/* deploy-package/.next/static/
            fi

            if [ -d "public" ]; then
              cp -r public deploy-package/
            fi
          # --- 通常出力の場合 ---
          else
            echo "Regular mode detected"
            cp -r .next deploy-package/
            if [ -d "public" ]; then
              cp -r public deploy-package/
            fi
            cp package*.json deploy-package/
            cp -r node_modules deploy-package/
          fi

          # next.config.jsが必要なら含める
          if [ -f "next.config.js" ]; then
            cp next.config.js deploy-package/
          fi

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app-${{ github.run_number }}
          path: deploy-package

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment: production

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app-${{ github.run_number }}

      - name: 'Deploy to Azure Web App'
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'aps-IRODORI-01-service'
          slot-name: 'Production'
          package: .
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_F0E9C33F765B4B56A224959CC04D6A5F }}
