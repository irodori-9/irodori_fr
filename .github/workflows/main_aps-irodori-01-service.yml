name: Build and deploy Node.js app to Azure Web App - aps-IRODORI-01-service

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build
        env:
          NODE_ENV: production
          NEXT_PUBLIC_API_BASE_URL: ${{ secrets.NEXT_PUBLIC_API_BASE_URL }}
          NEXT_TELEMETRY_DISABLED: 1

      # Copy artifact for deployment job
      - name: Copy artifact for deployment job
        run: |
          mkdir deploy
          # Copy standalone files (includes server.js generated by Next.js)
          cp -r ./.next/standalone/. ./deploy
          # Copy public directory
          cp -r ./public ./deploy || echo "No public directory found"
          # Copy static files to correct location
          cp -r ./.next/static/. ./deploy/.next/static || echo "No static directory found"
          
          # Create custom server.js to ensure compatibility
          cat > ./deploy/server.js << 'EOF'
          const { hostname } = require('os');
          const http = require('http');
          const path = require('path');

          const nextServer = require('next/dist/server/next-server').default;

          const port = process.env.PORT || 8000;
          const dev = false;

          const server = new nextServer({
            hostname: '0.0.0.0',
            port: port,
            dir: __dirname,
            dev: dev,
            customServer: false,
          });

          server.prepare().then(() => {
            const app = server.getRequestHandler();
            
            http.createServer(app).listen(port, '0.0.0.0', (err) => {
              if (err) throw err;
              console.log(`> Ready on http://0.0.0.0:${port}`);
            });
          });
          EOF

      # 画像の指示通り: zipコマンドの修正
      - name: Zip Release  
        run: zip -r release.zip ./deploy

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app-${{ github.run_number }}
          path: release.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment: production

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app-${{ github.run_number }}

      - name: 'Deploy to Azure Web App'
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'aps-IRODORI-01-service'
          slot-name: 'Production'
          # 画像の指示通り: packageパスの修正
          package: release.zip
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_F0E9C33F765B4B56A224959CC04D6A5F }}
