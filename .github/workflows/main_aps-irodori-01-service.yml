name: Build and deploy Node.js app to Azure Web App - aps-IRODORI-01-service

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'  # キャッシュを有効にして高速化

      - name: Install dependencies (production only)
        run: |
          npm ci --only=production
          
      - name: Install dev dependencies for build
        run: npm ci

      - name: Build application
        run: npm run build
        env:
          NODE_ENV: production
          NEXT_PUBLIC_API_BASE_URL: ${{ secrets.NEXT_PUBLIC_API_BASE_URL }}

      - name: Create deployment package
        run: |
          # Next.js standalone出力の場合
          mkdir deploy-package
          cp -r .next/standalone/* deploy-package/
          cp -r .next/static deploy-package/.next/static
          cp -r public deploy-package/public
          # package.jsonとnode_modulesは含めない（standalone モード）
          
          # または通常モードの場合
          # mkdir deploy-package
          # cp -r .next deploy-package/
          # cp -r public deploy-package/
          # cp package*.json deploy-package/
          # npm ci --only=production --prefix deploy-package

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app-${{ github.run_number }}
          path: deploy-package  # 最適化されたパッケージのみ

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment: production  # 環境保護の追加

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app-${{ github.run_number }}

      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'aps-IRODORI-01-service'
          slot-name: 'Production'
          package: .
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_F0E9C33F765B4B56A224959CC04D6A5F }}
